play_card:
  fields:
    card:
      required: true
      example: "Lína langsokkur"
      selector:
        text:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: nfc_story_box
stop:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: nfc_story_box
sleep_timer:
  fields:
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
    entry_id:
      required: false
      selector:
        config_entry:
          integration: nfc_story_box
set_speaker:
  fields:
    player:
      required: false
      selector:
        entity:
          domain: media_player
          integration: music_assistant
    entry_id:
      required: false
      selector:
        config_entry:
          integration: nfc_story_box
weekly_summary:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: nfc_story_box
